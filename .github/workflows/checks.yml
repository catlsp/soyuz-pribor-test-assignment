name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m product_copywriter examples/inputs.json --demo --format json --output /tmp/results.json
      - run: python -m product_copywriter examples/inputs.json --demo --format markdown --output /tmp/results.md
